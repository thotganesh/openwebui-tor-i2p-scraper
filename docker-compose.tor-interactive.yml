# Backend interattivo per Hermes (tor+): Tor Browser vero con API per-tab compatibile Camofox.
# Avvio: docker compose -f docker-compose.yml -f docker-compose.tor-interactive.yml up -d --no-deps browser-tor-interactive
services:
  browser-tor-interactive:
    build: ./browser-tor-interactive
    container_name: browser-tor-interactive
    restart: unless-stopped
    init: true
    networks: [ai-net, proxy-net]
    environment:
      - TOR_HOST=tor-proxy-camofox
      - TOR_CONTROL_PASSWORD=${TOR_CONTROL_PASSWORD:?Set TOR_CONTROL_PASSWORD in .env}
      - TOR_NEWNYM=0
      - TB_DEBUG=0
      - MAX_TABS=2
      - IDLE_TIMEOUT=600
      - INTERACTIVE_JS=0
      - INTERACTIVE_BLOCK_MEDIA=0
    shm_size: 1gb
    mem_limit: 2g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=768m,mode=1777
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9377/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
