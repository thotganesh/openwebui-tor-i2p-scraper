# Servizio opzionale in parallelo a browser-tor (collaudo prima del cutover).
# Avvio: docker compose -f docker-compose.yml -f docker-compose.tor-real.yml up -d --no-deps browser-tor-real
services:
  browser-tor-real:
    build: ./browser-tor-real
    container_name: browser-tor-real
    init: true
    networks: [ai-net, proxy-net]
    environment:
      - TOR_CONTROL_PASSWORD=${TOR_CONTROL_PASSWORD:?Set TOR_CONTROL_PASSWORD in .env}
      - MAX_CONCURRENT=2
      - TOR_NEWNYM=0
      - TB_DEBUG=0
      - TB_EXTRA_PREFS=${TB_EXTRA_PREFS:-}
    ports:
      - "127.0.0.1:8086:8081"
    shm_size: 1gb
    mem_limit: 2g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=768m,mode=1777
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
