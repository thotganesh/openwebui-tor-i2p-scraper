name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck install.sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck install.sh

      - name: docker compose config (with .env.example)
        run: |
          cp .env.example .env
          docker compose config -q

      - name: py_compile (active python files only)
        run: |
          python3 -m py_compile \
            browser-http/app.py \
            browser-clear/app.py \
            browser-camoufox/app.py \
            browser-i2p/app.py \
            browser-tor-real/app.py \
            browser-tor-real/fetch_tb.py \
            browser-tor-interactive/interactive.py \
            browser-tor-interactive/test_interactive.py \
            openwebui-tools/web_tool.py \
            openwebui-tools/darknet_tool.py

      - name: build browser-http image (lightweight sanity check)
        run: docker build browser-http
  ssrf-guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install test deps
        run: pip install -q pytest

      - name: ssrf_guard unit tests
        run: pytest tests/ -v
