services:
  tor-proxy:
    build: ./tor-snowflake
    container_name: tor-proxy
    networks: [proxy-net]
    environment:
      - TOR_CONTROL_HASH=${TOR_CONTROL_HASH:?Set TOR_CONTROL_HASH in .env}
    command: ["sh", "-c", "exec tor -f /etc/tor/torrc --HashedControlPassword \"$$TOR_CONTROL_HASH\""]
    volumes:
      - ./tor-snowflake/torrc:/etc/tor/torrc:ro
      - tor-data:/var/lib/tor
    restart: unless-stopped

  # Secondo client Tor con circuiti indipendenti: separa i circuiti di
  # camofox-tor (hermes-stealth-stack) da quelli di browser-tor. Un NEWNYM
  # su tor-proxy non tocca piu' i circuiti di camofox-tor, e viceversa.
  tor-proxy-camofox:
    build: ./tor-snowflake
    container_name: tor-proxy-camofox
    networks: [proxy-net]
    environment:
      - TOR_CONTROL_HASH=${TOR_CONTROL_HASH:?Set TOR_CONTROL_HASH in .env}
    command: ["sh", "-c", "exec tor -f /etc/tor/torrc --HashedControlPassword \"$$TOR_CONTROL_HASH\""]
    volumes:
      - ./tor-snowflake/torrc:/etc/tor/torrc:ro
      - tor-data-camofox:/var/lib/tor
    restart: unless-stopped

  browser-tor:
    build: ./browser-tor
    container_name: browser-tor
    networks: [ai-net, proxy-net]
    environment:
      - TOR_CONTROL_PASSWORD=${TOR_CONTROL_PASSWORD:?Set TOR_CONTROL_PASSWORD in .env}
    depends_on: [tor-proxy]
    ports:
      - "127.0.0.1:8081:8081"
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  browser-clear:
    build: ./browser-clear
    container_name: browser-clear
    networks: [ai-net]
    ports:
      - "127.0.0.1:8082:8080"
    shm_size: 1gb
    volumes:
      - ./shared:/app/shared:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  i2p-proxy:
    image: purplei2p/i2pd@sha256:7b9a0a9f65fe7b3a280dd4fa7c2a3712d49a972f151defa3a78fbdd2ce40bd2d
    container_name: i2p-proxy
    networks: [proxy-net]
    command: --httpproxy.address=0.0.0.0 --socksproxy.address=0.0.0.0
    restart: unless-stopped
    volumes:
      - ./i2p-data:/home/i2pd/data

  browser-i2p:
    build: ./browser-i2p
    container_name: browser-i2p
    networks: [ai-net, proxy-net]
    depends_on: [i2p-proxy]
    ports:
      - "127.0.0.1:8083:8083"
    shm_size: 1gb
    volumes:
      - ./shared:/app/shared:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8083/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
 
  browser-http:
    build: ./browser-http
    container_name: browser-http
    networks: [ai-net]
    ports:
      - "127.0.0.1:8084:8084"
    shm_size: 1gb
    volumes:
      - ./shared:/app/shared:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8084/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  solverr:
    image: ghcr.io/unseensnick/solverr@sha256:4235afe91686bfaf1bc0bd52f825a05a3a885735fe5f907329bd0595e1f8b4c5
    container_name: solverr
    networks: [ai-net]
    ports:
      - "127.0.0.1:8191:8191"
    shm_size: 512mb
    restart: unless-stopped
  
  searxng:
    image: searxng/searxng@sha256:76b0bf285aca014c7191fc4d9234c4bfb358624ac33d8883833d496c059ec072
    container_name: searxng
    networks: [ai-net]
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng-config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    restart: unless-stopped

  browser-camoufox:
    build: ./browser-camoufox
    container_name: browser-camoufox
    networks: [ai-net]
    ports:
      - "127.0.0.1:8085:8085"
    shm_size: 1gb
    volumes:
      - ./shared:/app/shared:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8085/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  fourget:
    image: luuul/4get:1.0.60
    container_name: fourget
    networks: [ai-net, proxy-net]
    environment:
      - FOURGET_PROTO=http
      - FOURGET_SERVER_NAME=fourget.local
      - FOURGET_FPLAY_EXTERNAL_ENDPOINT=http://fourplay:3000
      - FOURGET_FPLAY_PASSWORD=cnc
      - FOURGET_FPLAY_TIMEOUT=30000
      - FOURGET_FPLAY_ENABLE_API=true
    volumes:
      - ./fourget-data:/var/www/html/data:rw
      - ./fourget-proxies:/var/www/html/proxies:rw
    ports:
      - "127.0.0.1:8090:80"
    restart: unless-stopped

  fourplay:
    build: ./4play-build
    image: local/4get-4play:latest
    container_name: fourplay
    networks: [ai-net, fourplay-net]
    environment:
      - FOURPLAY_PORT=3030
      - FOURPLAY_PASSWORD=cnc
      - FOURPLAY_COMMAND_TIMEOUT=5000
    ports:
      - "127.0.0.1:3030:3030"
    restart: unless-stopped

  firefox-4play:
    image: jlesage/firefox:latest
    container_name: firefox-4play
    # Isolato su fourplay-net: raggiunge fourplay:3030 ma non vede
    # gli altri container di ai-net (hermes, open-webui, browser-*, tor-proxy).
    networks: [fourplay-net]
    environment:
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
      - KEEP_APP_RUNNING=1
      - VNC_PASSWORD=${VNC_PASSWORD:?imposta VNC_PASSWORD in .env}
    volumes:
      - ./firefox-4play-data:/config:rw
    ports:
      - "127.0.0.1:5900:5900"
    shm_size: 1gb
    mem_limit: 2g
    restart: unless-stopped

networks:
  ai-net:
    external: true
  proxy-net:
    external: true
  fourplay-net:
    name: fourplay-net
    external: true

volumes:
  tor-data:
  tor-data-camofox:
